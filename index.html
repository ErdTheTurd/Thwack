<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thwack</title>
  <meta name="description" content="Thwack — offline golf launch monitor for iPhone." />
  <style>
    :root {
      --bg: #080808;
      --text: #f4f4f4;
      --muted: #b8b8b8;
      --accent: #3ddc84;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: "SF Pro Text", "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(1000px 520px at 15% -5%, #143322 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      text-align: center;
    }
    .brand {
      font-size: 0.85rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin: 0 0 0.75rem;
    }
    h1 {
      font-size: clamp(2.6rem, 8vw, 4.5rem);
      letter-spacing: -0.04em;
      margin: 0 0 0.75rem;
      line-height: 1;
    }
    p {
      color: var(--muted);
      max-width: 34rem;
      margin: 0 auto 1.75rem;
      line-height: 1.55;
    }
    a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    }
  </style>
</head>
<body>
  <div>
    <p class="brand">Thwack</p>
    <h1>Offline launch monitor</h1>
    <p>Camera, tracking, and numbers stay on your iPhone. No account. No upload.</p>
    <p><a href="Privacy/">Privacy Policy</a></p>
  </div>
</body>
</html>
